name: Astro migration — build only (never deploy)
on:
  push:
    branches:
      - migration/astro-20261027
    paths:
      - 'astro/**'
      - '_posts/**'
      - '_data/**'
      - 'assets/**'
      - 'prompts/**'
      - 'en/prompts/**'
      - 'eao/**'
      - 'toolscout/**'
      - '.github/workflows/astro-migration.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  astro-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install packages (generate reproducible lockfile if missing)
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Build Astro static site
        run: npm run build
      - name: Verify generated pages and legacy asset parity
        run: npm run check
      - name: Store isolated preview build (not a Pages deployment)
        uses: actions/upload-artifact@v4
        with:
          name: astro-migration-preview
          path: astro/dist/
          retention-days: 7
      - name: Commit first lockfile to migration branch only
        if: success()
        run: |
          if [ -f package-lock.json ] && ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build(astro): lock tested Astro 7 dependencies"
            git push origin HEAD:migration/astro-20261027
          fi
