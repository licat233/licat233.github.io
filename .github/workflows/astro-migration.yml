name: Astro migration — build only (never deploy)
on:
  push:
    branches:
      - migration/astro-20261027
    paths:
      - 'astro/**'
      - '_posts/**'
      - '_data/**'
      - 'assets/**'
      - 'prompts/**'
      - 'en/prompts/**'
      - 'eao/**'
      - 'toolscout/**'
      - '.github/workflows/astro-migration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  astro-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install reproducible locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Astro static site
        run: npm run build
      - name: Verify generated pages and legacy asset parity
        run: npm run check
      - name: Store isolated preview build (not a Pages deployment)
        uses: actions/upload-artifact@v4
        with:
          name: astro-migration-preview
          path: astro/dist/
          retention-days: 7
