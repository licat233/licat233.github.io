<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Licat personal homepage and project entries.">
  <meta name="theme-color" content="#111315">
  <title>Licat / licat233</title>
  <link rel="alternate" hreflang="zh-CN" href="https://licat233.github.io/zh/">
  <link rel="alternate" hreflang="en" href="https://licat233.github.io/en/">
  <link rel="alternate" hreflang="x-default" href="https://licat233.github.io/">
  <link rel="icon" href="/assets/licat-logo.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico">
  <style>
    :root{color-scheme:dark;--bg:#111315;--panel:#181b1d;--text:#f1f0eb;--muted:#a7aaa7;--line:#34383a;--accent:#7ca7ff;--green:#20d7ca;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;--sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{font-family:var(--sans);margin:0;min-height:100vh;background:var(--bg);color:var(--text);display:grid;place-items:center;line-height:1.6}.wrap{width:min(920px,calc(100% - 36px));padding:64px 0}.brand{display:flex;align-items:center;gap:12px;font:800 14px/1 var(--mono);letter-spacing:.08em;color:var(--muted);margin-bottom:38px}.brand img{width:34px;height:34px;object-fit:contain;background:#f4f1ea;border:1px solid var(--line);padding:4px}.brand i{color:var(--accent);font-style:normal}h1{font-size:clamp(42px,8vw,82px);line-height:.98;letter-spacing:-.055em;margin:0 0 18px}.lead{font-size:clamp(18px,2.2vw,23px);color:var(--muted);max-width:720px;margin:0 0 34px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}a.card{display:block;min-height:190px;background:var(--bg);padding:26px;text-decoration:none;color:inherit;transition:background .15s ease,transform .15s ease}a.card:hover{background:var(--panel);transform:translateY(-2px)}.card b{display:block;color:var(--accent);font:800 11px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase}.card h2{font-size:26px;margin:34px 0 10px;line-height:1.1}.card p{color:var(--muted);margin:0;font-size:14px}.tool b,.tool h2{color:var(--green)}footer{margin-top:28px;color:var(--muted);font:500 11px/1.6 var(--mono)}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:44px 0}a.card{min-height:160px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><img src="/assets/licat-logo.svg" alt=""><span>LICAT<i>/</i>233</span></div>
    <h1>Choose a page.</h1>
    <p class="lead">选择语言版本，或直接进入 ToolScout 项目主页。</p>
    <div class="grid">
      <a class="card" href="/zh/">
        <b>Personal homepage</b>
        <h2>中文主页 ↗</h2>
        <p>开发者、系统构建、AI Agent 与公开项目。</p>
      </a>
      <a class="card" href="/en/">
        <b>Personal homepage</b>
        <h2>English ↗</h2>
        <p>Developer, systems, AI agents and selected public work.</p>
      </a>
      <a class="card tool" href="/toolscout/">
        <b>Project page</b>
        <h2>ToolScout ↗</h2>
        <p>Tool-first pre-code gate for AI agents.</p>
      </a>
    </div>
    <footer>© <span id="year"></span> Licat / licat233 · GitHub Pages</footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
