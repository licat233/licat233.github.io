<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Licat</title>
  <link rel="alternate" hreflang="zh-CN" href="https://licat233.github.io/zh/">
  <link rel="alternate" hreflang="en" href="https://licat233.github.io/en/">
  <script>
    (function(){
      var lang=(navigator.language||"").toLowerCase();
      location.replace(lang.indexOf("zh")===0?"/zh/":"/en/");
    }());
  </script>
  <style>
    body{font:16px system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#111315;color:#f1f0eb}
    main{text-align:center;padding:32px} a{color:#7ca7ff;margin:0 10px}
  </style>
</head>
<body>
  <main><p>Choose language / 选择语言</p><p><a href="/zh/">中文</a><a href="/en/">English</a></p></main>
</body>
</html>
