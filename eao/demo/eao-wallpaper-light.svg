<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract luminous flowing color landscape">
 <defs>
  <linearGradient id="base" x1="0" y1="0" x2=".95" y2="1">
   <stop offset="0" stop-color="#ffcf8b"/><stop offset=".32" stop-color="#e75aa4"/><stop offset=".69" stop-color="#536bdb"/><stop offset="1" stop-color="#067cbe"/>
  </linearGradient>
  <radialGradient id="sun"><stop stop-color="#ffdd3c" stop-opacity=".98"/><stop offset=".47" stop-color="#ff752b" stop-opacity=".79"/><stop offset="1" stop-color="#ff752b" stop-opacity="0"/></radialGradient>
  <radialGradient id="pink"><stop stop-color="#ff4dc0" stop-opacity=".97"/><stop offset=".58" stop-color="#ff516e" stop-opacity=".65"/><stop offset="1" stop-color="#ff516e" stop-opacity="0"/></radialGradient>
  <radialGradient id="ice"><stop stop-color="#20d8e2" stop-opacity=".93"/><stop offset=".55" stop-color="#1b9fff" stop-opacity=".66"/><stop offset="1" stop-color="#1b9fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="mint"><stop stop-color="#32e2b9" stop-opacity=".79"/><stop offset="1" stop-color="#32e2b9" stop-opacity="0"/></radialGradient>
  <linearGradient id="amberBand" x1="0" y1="0" x2=".9" y2="1">
    <stop stop-color="#ffdd3c" stop-opacity=".98"/><stop offset=".27" stop-color="#ff752b" stop-opacity=".93"/><stop offset=".67" stop-color="#ff4dc0" stop-opacity=".68"/><stop offset="1" stop-color="#8951d8" stop-opacity=".09"/>
  </linearGradient>
  <linearGradient id="violetBand" x1="0" y1=".15" x2="1" y2=".9">
   <stop stop-color="#ff4dc0" stop-opacity=".06"/><stop offset=".18" stop-color="#8951d8" stop-opacity=".93"/><stop offset=".48" stop-color="#293ac1" stop-opacity=".92"/><stop offset=".8" stop-color="#1b9fff" stop-opacity=".80"/><stop offset="1" stop-color="#20d8e2" stop-opacity=".22"/>
  </linearGradient>
  <linearGradient id="blueBand" x1="0" y1="0" x2="1" y2=".92">
   <stop stop-color="#20d8e2" stop-opacity=".05"/><stop offset=".21" stop-color="#20d8e2" stop-opacity=".89"/><stop offset=".47" stop-color="#1b9fff" stop-opacity=".95"/><stop offset=".81" stop-color="#293ac1" stop-opacity=".85"/><stop offset="1" stop-color="#8951d8" stop-opacity=".11"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2=".62">
   <stop stop-color="#fff2e6" stop-opacity="0"/><stop offset=".28" stop-color="#fff2e6" stop-opacity=".82"/><stop offset=".55" stop-color="#fff2e6" stop-opacity=".27"/><stop offset="1" stop-color="#fff2e6" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-40%" width="160%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="silk" x="-12%" y="-15%" width="124%" height="130%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="13"/></filter>
 </defs>
 <rect width="1600" height="1000" fill="url(#base)"/>
 <!-- Broad pools make the art painterly instead of a set of CSS circles. -->
 <ellipse cx="180" cy="160" rx="550" ry="430" fill="url(#sun)"/>
 <ellipse cx="800" cy="230" rx="590" ry="430" fill="url(#pink)"/>
 <ellipse cx="1450" cy="680" rx="670" ry="560" fill="url(#ice)"/>
 <ellipse cx="210" cy="895" rx="580" ry="420" fill="url(#mint)"/>
 <!-- Asymmetric overlapping silk curves: large geometry, minimal texture. -->
 <path d="M-170 90 C250 -80 525 235 730 250 C1040 285 1250 -105 1770 -130 L1760 245 C1310 230 1180 520 830 475 C485 425 250 250 -130 435Z" fill="url(#amberBand)" opacity=".91"/>
 <path d="M-230 560 C125 190 300 220 585 380 C875 535 1110 390 1715 90 L1740 480 C1295 520 1020 810 655 610 C305 418 130 565 -160 945Z" fill="url(#violetBand)" opacity=".89"/>
 <path d="M-200 1100 C165 535 435 920 760 740 C1100 550 1300 260 1785 420 L1830 1200Z" fill="url(#blueBand)" opacity=".94"/>
 <!-- Fine luminous veins highlight the twisting waveforms, not neon outlines. -->
 <path d="M-120 260 C265 85 540 353 785 361 S1240 173 1688 87" fill="none" stroke="url(#glow)" stroke-width="42" opacity=".65" filter="url(#silk)"/>
 <path d="M-130 518 C205 237 393 296 623 440 C1000 650 1192 354 1735 245" fill="none" stroke="url(#glow)" stroke-width="33" opacity=".60" filter="url(#silk)"/>
 <path d="M-130 970 C244 555 418 970 780 756 C1030 608 1324 367 1760 502" fill="none" stroke="url(#glow)" stroke-width="42" opacity=".42" filter="url(#soft)"/>
 <!-- A few crisp specular boundaries retain the three-dimensional satin feel. -->
 <path d="M-100 245 C270 102 535 326 785 343 S1234 164 1680 74" fill="none" stroke="#fff2e6" stroke-width="2.2" opacity=".22"/>
 <path d="M-113 519 C199 241 397 299 629 447 C991 637 1180 354 1695 258" fill="none" stroke="#fff2e6" stroke-width="2" opacity=".19"/>
 </svg>