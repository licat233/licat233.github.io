<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="聊天式 AI 与 EAO：区别在企业上下文如何进入工作过程">
<rect width="1200" height="675" fill="#f7fbfa"/>
<g font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" fill="#10201e"><text x="55" y="58" font-size="30" font-weight="800" fill="#10201e" text-anchor="start">聊天式 AI 与 EAO：区别在企业上下文如何进入工作过程</text><text x="55" y="92" font-size="16" font-weight="500" fill="#60716e" text-anchor="start">通用 AI 可以很强；EAO 进一步把获准的企业知识、文件、历史和工具组织进日常工作。</text><rect x="55" y="125" width="500" height="455" rx="14" fill="#f1f4f3" stroke="#d7e5e2" stroke-width="1.4"/><rect x="645" y="125" width="500" height="455" rx="14" fill="#e7f8f6" stroke="#d7e5e2" stroke-width="1.4"/><text x="85" y="165" font-size="22" font-weight="800" fill="#10201e" text-anchor="start">常见聊天式 AI 工作方式</text><text x="675" y="165" font-size="22" font-weight="800" fill="#087a74" text-anchor="start">EAO 企业工作方式</text><text x="85" y="198" font-size="15" font-weight="600" fill="#60716e" text-anchor="start">企业上下文主要由员工自己准备</text><text x="675" y="198" font-size="15" font-weight="600" fill="#60716e" text-anchor="start">企业上下文已被组织进获准的工作环境</text><rect x="85" y="225" width="440" height="58" rx="14" fill="#ffffff" stroke="#d7e5e2" stroke-width="1.4"/><circle cx="116" cy="254" r="17" fill="#7b8986"/><text x="116" y="260" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="150" y="261" font-size="17" font-weight="650" fill="#10201e" text-anchor="start">找资料与历史</text><rect x="85" y="303" width="440" height="58" rx="14" fill="#ffffff" stroke="#d7e5e2" stroke-width="1.4"/><circle cx="116" cy="332" r="17" fill="#7b8986"/><text x="116" y="338" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="150" y="339" font-size="17" font-weight="650" fill="#10201e" text-anchor="start">复制 / 上传相关内容</text><rect x="85" y="381" width="440" height="58" rx="14" fill="#ffffff" stroke="#d7e5e2" stroke-width="1.4"/><circle cx="116" cy="410" r="17" fill="#7b8986"/><text x="116" y="416" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="150" y="417" font-size="17" font-weight="650" fill="#10201e" text-anchor="start">向 AI 提问</text><rect x="85" y="459" width="440" height="58" rx="14" fill="#ffffff" stroke="#d7e5e2" stroke-width="1.4"/><circle cx="116" cy="488" r="17" fill="#7b8986"/><text x="116" y="494" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="150" y="495" font-size="17" font-weight="650" fill="#10201e" text-anchor="start">再核对并拼回实际工作</text><rect x="675" y="225" width="96" height="42" rx="12" fill="#e7f8f6" stroke="none" stroke-width="1.4"/><text x="723.0" y="252" font-size="15" font-weight="700" fill="#087a74" text-anchor="middle">企业知识</text><rect x="783" y="225" width="96" height="42" rx="12" fill="#e7f8f6" stroke="none" stroke-width="1.4"/><text x="831.0" y="252" font-size="15" font-weight="700" fill="#087a74" text-anchor="middle">文件</text><rect x="891" y="225" width="96" height="42" rx="12" fill="#e7f8f6" stroke="none" stroke-width="1.4"/><text x="939.0" y="252" font-size="15" font-weight="700" fill="#087a74" text-anchor="middle">历史</text><rect x="999" y="225" width="96" height="42" rx="12" fill="#e7f8f6" stroke="none" stroke-width="1.4"/><text x="1047.0" y="252" font-size="15" font-weight="700" fill="#087a74" text-anchor="middle">获准工具</text><line x1="723" y1="267" x2="895" y2="307" stroke="#d7e5e2" stroke-width="2"/><line x1="831" y1="267" x2="895" y2="307" stroke="#d7e5e2" stroke-width="2"/><line x1="939" y1="267" x2="895" y2="307" stroke="#d7e5e2" stroke-width="2"/><line x1="1047" y1="267" x2="895" y2="307" stroke="#d7e5e2" stroke-width="2"/><rect x="755" y="305" width="280" height="78" rx="14" fill="#ffffff" stroke="#08cfc4" stroke-width="1.4"/><text x="895" y="338" font-size="24" font-weight="850" fill="#087a74" text-anchor="middle">EAO</text><text x="895" y="363" font-size="14" font-weight="600" fill="#60716e" text-anchor="middle">结合部门边界与权限</text><line x1="895" y1="390" x2="885" y2="425" stroke="#08cfc4" stroke-width="3" stroke-linecap="round"/>
<path d="M 881 418 L 895 425 L 881 432" fill="none" stroke="#08cfc4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="715" y="425" width="360" height="72" rx="14" fill="#ffffff" stroke="#d7e5e2" stroke-width="1.4"/><text x="895" y="455" font-size="17" font-weight="750" fill="#10201e" text-anchor="middle">准备回复 · 研究 · 比较 · 计算</text><text x="895" y="479" font-size="14" font-weight="500" fill="#60716e" text-anchor="middle">形成可供员工检查的工作成果</text><line x1="895" y1="505" x2="885" y2="535" stroke="#08cfc4" stroke-width="3" stroke-linecap="round"/>
<path d="M 881 528 L 895 535 L 881 542" fill="none" stroke="#08cfc4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="790" y="530" width="210" height="42" rx="12" fill="#dff4f1" stroke="none" stroke-width="1.4"/><text x="895.0" y="557" font-size="15" font-weight="700" fill="#087a74" text-anchor="middle">员工判断与确认</text><line x1="570" y1="352" x2="620" y2="352" stroke="#08cfc4" stroke-width="3" stroke-linecap="round"/>
<path d="M 616 345 L 630 352 L 616 359" fill="none" stroke="#08cfc4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="630" font-size="17" font-weight="700" fill="#087a74" text-anchor="middle">重点不是“模型更聪明”，而是企业上下文、工具与权限是否已经进入工作过程。</text></g></svg>