<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Department methods can be retained from real work and reused later">
<rect width="1200" height="675" fill="#f7fbfa"/>
<g font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" fill="#10201e"><text x="55" y="58" font-size="30" font-weight="800" fill="#10201e" text-anchor="start">Department methods can be retained from real work and reused later</text><text x="55" y="92" font-size="16" font-weight="500" fill="#60716e" text-anchor="start">Only stable, reusable department experience should persist; one-off task state, private data and authority expansion should not.</text><rect x="40" y="165" width="250" height="310" rx="14" fill="#ffffff" stroke="#d7e5e2" stroke-width="1.4"/><circle cx="78" cy="205" r="17" fill="#087a74"/><text x="78" y="211" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="106" y="212" font-size="17" font-weight="800" fill="#10201e" text-anchor="start">Real work</text><rect x="68" y="250" width="27" height="34" rx="4" fill="none" stroke="#087a74" stroke-width="2"/>
<path d="M 85 250 L 95 260 L 85 260 Z" fill="#e7f8f6" stroke="#087a74" stroke-width="2"/>
<line x1="74" y1="268" x2="89" y2="268" stroke="#087a74" stroke-width="2"/>
<line x1="74" y1="275" x2="86" y2="275" stroke="#087a74" stroke-width="2"/><text x="68" y="330" font-size="13.5" font-weight="520" fill="#60716e" text-anchor="start"><tspan x="68" dy="0">Employees complete a real task</tspan><tspan x="68" dy="28">and discover a better method.</tspan></text><line x1="295" y1="320" x2="315" y2="320" stroke="#08cfc4" stroke-width="3" stroke-linecap="round"/>
<path d="M 311 313 L 325 320 L 311 327" fill="none" stroke="#08cfc4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="330" y="165" width="250" height="310" rx="14" fill="#ffffff" stroke="#d7e5e2" stroke-width="1.4"/><circle cx="368" cy="205" r="17" fill="#087a74"/><text x="368" y="211" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="396" y="212" font-size="17" font-weight="800" fill="#10201e" text-anchor="start">Reusable method</text><rect x="358" y="250" width="8" height="8" rx="2" fill="#087a74"/><rect x="369" y="250" width="8" height="8" rx="2" fill="#087a74"/><rect x="380" y="250" width="8" height="8" rx="2" fill="#087a74"/><rect x="358" y="261" width="8" height="8" rx="2" fill="#087a74"/><rect x="369" y="261" width="8" height="8" rx="2" fill="#08cfc4"/><rect x="380" y="261" width="8" height="8" rx="2" fill="#087a74"/><rect x="358" y="272" width="8" height="8" rx="2" fill="#087a74"/><rect x="369" y="272" width="8" height="8" rx="2" fill="#087a74"/><rect x="380" y="272" width="8" height="8" rx="2" fill="#087a74"/><text x="358" y="330" font-size="13.5" font-weight="520" fill="#60716e" text-anchor="start"><tspan x="358" dy="0">Separate stable lessons and methods</tspan><tspan x="358" dy="28">from one-off task details.</tspan></text><line x1="585" y1="320" x2="605" y2="320" stroke="#08cfc4" stroke-width="3" stroke-linecap="round"/>
<path d="M 601 313 L 615 320 L 601 327" fill="none" stroke="#08cfc4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="620" y="165" width="250" height="310" rx="14" fill="#ffffff" stroke="#d7e5e2" stroke-width="1.4"/><circle cx="658" cy="205" r="17" fill="#087a74"/><text x="658" y="211" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="686" y="212" font-size="17" font-weight="800" fill="#10201e" text-anchor="start">Keep within boundaries</text><path d="M 662 246 L 678 252 V 266 C 678 277,669 284,662 288 C 655 284,646 277,646 266 V 252 Z" fill="#e7f8f6" stroke="#087a74" stroke-width="2"/>
<path d="M 655 266 l5 5 10-11" fill="none" stroke="#087a74" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="648" y="330" font-size="13.5" font-weight="520" fill="#60716e" text-anchor="start"><tspan x="648" dy="0">Keep it only within department rules,</tspan><tspan x="648" dy="28">privacy limits and authorized scope.</tspan></text><line x1="875" y1="320" x2="895" y2="320" stroke="#08cfc4" stroke-width="3" stroke-linecap="round"/>
<path d="M 891 313 L 905 320 L 891 327" fill="none" stroke="#08cfc4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="910" y="165" width="250" height="310" rx="14" fill="#ffffff" stroke="#d7e5e2" stroke-width="1.4"/><circle cx="948" cy="205" r="17" fill="#087a74"/><text x="948" y="211" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="976" y="212" font-size="17" font-weight="800" fill="#10201e" text-anchor="start">Reuse in similar work</text><path d="M 936 272 C 955 244,985 244,1002 272" fill="none" stroke="#087a74" stroke-width="3"/><path d="M 998 260 l8 12 -14 2" fill="none" stroke="#087a74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="938" y="330" font-size="13.5" font-weight="520" fill="#60716e" text-anchor="start"><tspan x="938" dy="0">Reuse the method in similar work,</tspan><tspan x="938" dy="28">then refine it with later feedback.</tspan></text><rect x="95" y="525" width="1010" height="92" rx="12" fill="#f6f2ea" stroke="#eadfc8" stroke-width="1.4"/><path d="M 143 548 L 159 554 V 568 C 159 579,150 586,143 590 C 136 586,127 579,127 568 V 554 Z" fill="#e7f8f6" stroke="#087a74" stroke-width="2"/>
<path d="M 136 568 l5 5 10-11" fill="none" stroke="#087a74" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="185" y="558" font-size="17" font-weight="800" fill="#10201e" text-anchor="start">Reusable methods may persist; not every conversation becomes long-term memory.</text><text x="185" y="590" font-size="13.5" font-weight="600" fill="#60716e" text-anchor="start">Exclude: one-off task state · private/sensitive data · credentials · approval state · authority expansion</text></g></svg>