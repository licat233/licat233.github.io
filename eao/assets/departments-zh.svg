<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="同一个 EAO 工作系统，不同部门使用不同的工作环境">
<rect width="1200" height="675" fill="#f7fbfa"/>
<g font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" fill="#10201e"><text x="55" y="58" font-size="30" font-weight="800" fill="#10201e" text-anchor="start">同一个 EAO 工作系统，不同部门使用不同的工作环境</text><text x="55" y="92" font-size="16" font-weight="500" fill="#60716e" text-anchor="start">部门差异来自获准的知识、文件、工具和权限范围，而不是为每个部门再部署一套独立系统。</text><rect x="420" y="128" width="360" height="112" rx="16" fill="#ffffff" stroke="#08cfc4" stroke-width="1.4"/><rect x="455" y="164" width="8" height="8" rx="2" fill="#087a74"/><rect x="466" y="164" width="8" height="8" rx="2" fill="#087a74"/><rect x="477" y="164" width="8" height="8" rx="2" fill="#087a74"/><rect x="455" y="175" width="8" height="8" rx="2" fill="#087a74"/><rect x="466" y="175" width="8" height="8" rx="2" fill="#08cfc4"/><rect x="477" y="175" width="8" height="8" rx="2" fill="#087a74"/><rect x="455" y="186" width="8" height="8" rx="2" fill="#087a74"/><rect x="466" y="186" width="8" height="8" rx="2" fill="#087a74"/><rect x="477" y="186" width="8" height="8" rx="2" fill="#087a74"/><text x="510" y="168" font-size="28" font-weight="850" fill="#087a74" text-anchor="start">EAO</text><text x="510" y="197" font-size="16" font-weight="600" fill="#60716e" text-anchor="start">统一员工入口 + 部门工作环境</text><path d="M 600 240 C 600 275, 145 265, 145 310" fill="none" stroke="#d7e5e2" stroke-width="2.2"/><circle cx="145" cy="310" r="4" fill="#08cfc4"/><path d="M 600 240 C 600 275, 370 265, 370 310" fill="none" stroke="#d7e5e2" stroke-width="2.2"/><circle cx="370" cy="310" r="4" fill="#08cfc4"/><path d="M 600 240 C 600 275, 595 265, 595 310" fill="none" stroke="#d7e5e2" stroke-width="2.2"/><circle cx="595" cy="310" r="4" fill="#08cfc4"/><path d="M 600 240 C 600 275, 820 265, 820 310" fill="none" stroke="#d7e5e2" stroke-width="2.2"/><circle cx="820" cy="310" r="4" fill="#08cfc4"/><path d="M 600 240 C 600 275, 1045 265, 1045 310" fill="none" stroke="#d7e5e2" stroke-width="2.2"/><circle cx="1045" cy="310" r="4" fill="#08cfc4"/><rect x="40" y="320" width="210" height="240" rx="14" fill="#ffffff" stroke="#d7e5e2" stroke-width="1.4"/><text x="60" y="358" font-size="21" font-weight="800" fill="#087a74" text-anchor="start">销售</text><line x1="60" y1="375" x2="230" y2="375" stroke="#d7e5e2" stroke-width="1.5"/><circle cx="64" cy="405" r="4" fill="#08cfc4"/><text x="78" y="410" font-size="14" font-weight="600" fill="#10201e" text-anchor="start">产品与历史资料</text><circle cx="64" cy="453" r="4" fill="#08cfc4"/><text x="78" y="458" font-size="14" font-weight="600" fill="#10201e" text-anchor="start">客户 / 市场研究</text><circle cx="64" cy="501" r="4" fill="#08cfc4"/><text x="78" y="506" font-size="14" font-weight="600" fill="#10201e" text-anchor="start">回复与销售材料</text><rect x="266" y="320" width="210" height="240" rx="14" fill="#ffffff" stroke="#d7e5e2" stroke-width="1.4"/><text x="286" y="358" font-size="21" font-weight="800" fill="#087a74" text-anchor="start">采购</text><line x1="286" y1="375" x2="456" y2="375" stroke="#d7e5e2" stroke-width="1.5"/><circle cx="290" cy="405" r="4" fill="#08cfc4"/><text x="304" y="410" font-size="14" font-weight="600" fill="#10201e" text-anchor="start">BOM 与物料</text><circle cx="290" cy="453" r="4" fill="#08cfc4"/><text x="304" y="458" font-size="14" font-weight="600" fill="#10201e" text-anchor="start">供应商研究比较</text><circle cx="290" cy="501" r="4" fill="#08cfc4"/><text x="304" y="506" font-size="14" font-weight="600" fill="#10201e" text-anchor="start">询价与成本材料</text><rect x="492" y="320" width="210" height="240" rx="14" fill="#ffffff" stroke="#d7e5e2" stroke-width="1.4"/><text x="512" y="358" font-size="21" font-weight="800" fill="#087a74" text-anchor="start">财务</text><line x1="512" y1="375" x2="682" y2="375" stroke="#d7e5e2" stroke-width="1.5"/><circle cx="516" cy="405" r="4" fill="#08cfc4"/><text x="530" y="410" font-size="14" font-weight="600" fill="#10201e" text-anchor="start">制度与财务文件</text><circle cx="516" cy="453" r="4" fill="#08cfc4"/><text x="530" y="458" font-size="14" font-weight="600" fill="#10201e" text-anchor="start">表格与数据汇总</text><circle cx="516" cy="501" r="4" fill="#08cfc4"/><text x="530" y="506" font-size="14" font-weight="600" fill="#10201e" text-anchor="start">报表与说明材料</text><rect x="718" y="320" width="210" height="240" rx="14" fill="#ffffff" stroke="#d7e5e2" stroke-width="1.4"/><text x="738" y="358" font-size="21" font-weight="800" fill="#087a74" text-anchor="start">运营</text><line x1="738" y1="375" x2="908" y2="375" stroke="#d7e5e2" stroke-width="1.5"/><circle cx="742" cy="405" r="4" fill="#08cfc4"/><text x="756" y="410" font-size="14" font-weight="600" fill="#10201e" text-anchor="start">市场 / 竞品研究</text><circle cx="742" cy="453" r="4" fill="#08cfc4"/><text x="756" y="458" font-size="14" font-weight="600" fill="#10201e" text-anchor="start">产品与内容整理</text><circle cx="742" cy="501" r="4" fill="#08cfc4"/><text x="756" y="506" font-size="14" font-weight="600" fill="#10201e" text-anchor="start">MIC 与运营材料</text><rect x="944" y="320" width="210" height="240" rx="14" fill="#ffffff" stroke="#d7e5e2" stroke-width="1.4"/><text x="964" y="358" font-size="21" font-weight="800" fill="#087a74" text-anchor="start">管理层</text><line x1="964" y1="375" x2="1134" y2="375" stroke="#d7e5e2" stroke-width="1.5"/><circle cx="968" cy="405" r="4" fill="#08cfc4"/><text x="982" y="410" font-size="14" font-weight="600" fill="#10201e" text-anchor="start">获准跨部门信息</text><circle cx="968" cy="453" r="4" fill="#08cfc4"/><text x="982" y="458" font-size="14" font-weight="600" fill="#10201e" text-anchor="start">复盘与会议材料</text><circle cx="968" cy="501" r="4" fill="#08cfc4"/><text x="982" y="506" font-size="14" font-weight="600" fill="#10201e" text-anchor="start">方案比较与决策输入</text><rect x="210" y="595" width="780" height="48" rx="12" fill="#e7f8f6" stroke="none" stroke-width="1.4"/><text x="600" y="626" font-size="17" font-weight="700" fill="#087a74" text-anchor="middle">同一套 EAO，根据部门边界组合不同的企业上下文与能力。</text></g></svg>